
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DHD IA</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#0b0813;color:#fff;
 font-family:Arial,sans-serif;min-height:100vh;
 display:flex;justify-content:center;align-items:center;
 padding:18px
}
.app{
 width:100%;max-width:650px;height:90vh;max-height:850px;
 background:#151020;border:1px solid #392653;
 border-radius:20px;display:flex;flex-direction:column;
 overflow:hidden;box-shadow:0 0 35px #7c3aed22
}
header{padding:22px;border-bottom:1px solid #392653}
h1{margin:0;color:#c084fc;font-size:27px}
header p{margin:7px 0 0;color:#aaa;font-size:13px}
#chat{flex:1;overflow-y:auto;padding:18px}
.msg{padding:13px 15px;border-radius:14px;margin:10px 0;
 max-width:88%;line-height:1.5;white-space:pre-wrap}
.bot{background:#261b38;border:1px solid #493164}
.user{background:#713bd1;margin-left:auto}
form{display:flex;gap:9px;padding:15px;border-top:1px solid #392653}
input{flex:1;min-width:0;background:#0e0a17;color:white;
 border:1px solid #493164;border-radius:12px;padding:14px;font-size:15px}
button{background:#9333ea;color:white;border:0;border-radius:12px;
 padding:0 18px;font-weight:bold}
button:disabled{opacity:.5}
small{color:#888;text-align:center;padding:0 12px 12px}
</style>
</head>
<body>
<div class="app">
<header>
<h1>⚡ DHD IA</h1>
<p>Sua inteligência artificial. Pergunte qualquer coisa.</p>
</header>
<div id="chat">
<div class="msg bot">Salve! Eu sou a DHD IA. Manda tua pergunta e vamos trocar ideia! 🔥</div>
</div>
<form id="form">
<input id="message" placeholder="Digite sua mensagem..." autocomplete="off">
<button id="send">Enviar</button>
</form>
<small>DHD IA • Assistente inteligente</small>
</div>
<script>
const form=document.getElementById('form');
const input=document.getElementById('message');
const chat=document.getElementById('chat');
const send=document.getElementById('send');

function addMessage(text,type){
 const div=document.createElement('div');
 div.className='msg '+type;
 div.textContent=text;
 chat.appendChild(div);
 chat.scrollTop=chat.scrollHeight;
}

form.addEventListener('submit',async e=>{
 e.preventDefault();
 const text=input.value.trim();
 if(!text)return;
 addMessage(text,'user');
 input.value='';
 send.disabled=true;
 send.textContent='...';
 try{
  const response=await fetch('/api/chat',{
   method:'POST',
   headers:{'Content-Type':'application/json'},
   body:JSON.stringify({messages:[{role:'user',content:text}]})
  });
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Erro ao conversar.');
  addMessage(data.reply||'Não recebi uma resposta.','bot');
 }catch(error){
  addMessage('Ainda falta configurar o motor de IA no servidor. Vamos configurar essa parte depois.','bot');
 }finally{
  send.disabled=false;
  send.textContent='Enviar';
  input.focus();
 }
});
</script>
</body>
</html>
